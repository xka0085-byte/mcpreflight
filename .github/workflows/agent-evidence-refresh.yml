name: Weekly Agent Evidence refresh
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh agent evidence sample
        run: node scripts/agent-evidence-refresh.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent-evidence-sample.html trust-data/agent-evidence
          git diff --cached --quiet || git commit -m "agent-evidence: weekly refresh $(date -u +%F) [skip ci]"
          git pull --rebase origin main || git pull --rebase --autostash origin main
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
            echo "push attempt $i failed, retrying in 5s"; sleep 5
          done

      - name: notify failure
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
