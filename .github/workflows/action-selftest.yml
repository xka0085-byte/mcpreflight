name: action selftest

on:
  workflow_dispatch:
  push:
    paths:
      - action.yml
      - .github/workflows/action-selftest.yml

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the action manifest
        run: |
          # The runner refuses to load action.yml if the root is not a mapping,
          # and an unquoted "CI: checks" in description did exactly that: the
          # whole workflow failed with "Failed to load ./action.yml" before any
          # step of the action ran. Catch that class of breakage here.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open('action.yml', encoding='utf-8-sig'))
          assert isinstance(d, dict), 'action manifest root must be a mapping'
          for key in ('name', 'description', 'runs'):
              assert key in d, 'missing %s' % key
          assert d['runs'].get('using') in ('composite', 'node20', 'node24', 'docker'), 'unexpected runs.using'
          desc = d['description']
          assert isinstance(desc, str), 'description must be a string, not a nested mapping'
          assert len(desc) < 125, 'Marketplace rejects descriptions of 125 characters or more (got %d)' % len(desc)
          print('manifest ok: %s / %d-char description / runs.using=%s' % (d['name'], len(desc), d['runs']['using']))
          PY
      - id: check
        uses: ./
        with:
          endpoint: https://mcp.deepwiki.com/mcp
          mode: schema
          # This job proves the action runs and emits outputs, not that a
          # third-party endpoint is reachable from a runner. A network blip or
          # rate limit on deepwiki must not turn the marketplace listing's CI
          # badge red, so pass/fail is read from the status output instead.
          fail_on: 'false'
      - name: Echo the status output
        run: |
          echo "preflight status=${{ steps.check.outputs.status }}"
          test -n "${{ steps.check.outputs.status }}"

  x402:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A dedicated job for mode: x402. It points at a local mock that answers
      # 402 with an x402 accepts[] body instead of a real paid service, so the
      # job tests our parsing of the payment layer and nothing else. The third
      # commit that added mode: x402 shipped with no coverage at all, which is
      # exactly the regression this job exists to prevent.
      - name: Serve a local endpoint that answers 402 with accepts[]
        run: |
          cat > /tmp/pay402.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          DOC = {
              "accepts": [
                  {
                      "scheme": "exact",
                      "network": "base-sepolia",
                      "asset": "USDC",
                      "maxAmountRequired": "1000",
                      "payTo": "0x0000000000000000000000000000000000000001",
                      "resource": "http://127.0.0.1:8787/paid",
                      "mimeType": "application/json",
                      "maxTimeoutSeconds": 60,
                  }
              ]
          }


          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = json.dumps(DOC).encode()
                  self.send_response(402)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass


          HTTPServer(("127.0.0.1", 8787), Handler).serve_forever()
          PY
          python3 /tmp/pay402.py &
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/paid || true)
            if [ "$code" = "402" ]; then exit 0; fi
            sleep 0.5
          done
          echo "mock endpoint did not answer 402" >&2
          exit 1
      - id: x402
        uses: ./
        with:
          endpoint: http://127.0.0.1:8787/paid
          mode: x402
          method: POST
          format: json
      - name: Assert the payment layer was read
        run: |
          echo "exit status=${{ steps.x402.outputs.status }}"
          test "${{ steps.x402.outputs.status }}" = "0"
