name: action selftest

on:
  workflow_dispatch:
  push:
    paths:
      - action.yml
      - .github/workflows/action-selftest.yml

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        with:
          endpoint: https://mcp.deepwiki.com/mcp
          mode: schema
      - name: Echo the status output
        run: echo "preflight status=${{ steps.check.outputs.status }}"
