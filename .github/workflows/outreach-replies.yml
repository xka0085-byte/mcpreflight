# Daily outreach reply check: snapshot issue states, open a digest issue when things change.
name: outreach-replies
on:
  schedule:
    - cron: '0 4 * * *' # daily; digest issue opened only when something changed
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check replies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/outreach-replies.mjs
      - name: Adoption funnel metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/funnel-metrics.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trust-data/metrics trust-data/outreach-metrics.json
          git diff --cached --quiet || git commit -m "chore: daily outreach + funnel snapshot"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
            echo "push attempt $i failed, retrying in 5s"; sleep 5
          done

      - name: notify failure
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
