# Daily outreach reply check: snapshot issue states, open a digest issue when things change.
name: outreach-replies
on:
  schedule:
    - cron: '0 4 * * *' # daily; digest issue opened only when something changed
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check replies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/outreach-replies.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trust-data/metrics/replies.json trust-data/outreach-metrics.json
          git diff --cached --quiet || git commit -m "chore: weekly outreach reply snapshot"
          git push
