name: Protocol event watch
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check protocol repos for new releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/protocol-watch.mjs
      - name: Open an issue for each new protocol event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(node -e "const j=require('./trust-data/protocol-events-pending.json');console.log(j.events.length)")
          if [ "$COUNT" -gt 0 ]; then
            node -e "
            const j=require('./trust-data/protocol-events-pending.json');
            for (const e of j.events) {
              const title = 'protocol event: ' + e.label + ' ' + e.from + ' -> ' + e.to;
              const body = 'New release detected by the daily watch.\n\nrepo: ' + e.repo + '\nfrom: ' + e.from + '\nto: ' + e.to + '\ndate: ' + e.date + '\nurl: ' + e.url + '\n\nPer the 48-hour measurement rule, evaluate whether this changes what we measure and whether a signed report or a new dimension should ship this week.';
              require('child_process').execSync('gh issue create --title ' + JSON.stringify(title) + ' --body ' + JSON.stringify(body), {stdio: 'inherit', env: process.env});
            }"
          else
            echo "no new protocol events"
          fi
      - name: Commit watch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trust-data/protocol-watch-state.json trust-data/protocol-events-pending.json
          git diff --cached --quiet || git commit -m "watch: protocol state $(date -u +%F) [skip ci]"
          git pull --rebase origin main || git pull --rebase --autostash origin main
          git push
