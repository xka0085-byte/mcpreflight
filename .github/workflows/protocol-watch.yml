name: Protocol event watch
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check protocol repos for new releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/protocol-watch.mjs
      - name: Append new protocol events to the rolling issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(node -e "const j=require('./trust-data/protocol-events-pending.json');console.log(j.events.length)")
          if [ "$COUNT" -gt 0 ]; then
            node -e "
            const j=require('./trust-data/protocol-events-pending.json');
            const lines = j.events.map(e => '- ' + e.label + ': ' + e.from + ' -> ' + e.to + ' (' + e.date + ')' + '\n  repo: ' + e.repo + '\n  url: ' + e.url);
            require('fs').writeFileSync('protocol-report.md', lines.join('\n\n') + '\n\nPer the 48-hour measurement rule, evaluate whether this changes what we measure and whether a signed report or a new dimension should ship this week.\n');
            "
            node scripts/rolling-issue.mjs --title "[watch] protocol release log" --body-file protocol-report.md
          else
            echo "no new protocol events"
          fi
      - name: Commit watch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trust-data/protocol-watch-state.json trust-data/protocol-events-pending.json
          git diff --cached --quiet || git commit -m "watch: protocol state $(date -u +%F) [skip ci]"
          git pull --rebase origin main || git pull --rebase --autostash origin main
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
            echo "push attempt $i failed, retrying in 5s"; sleep 5
          done

      - name: notify failure
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
