name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: npm test
      - name: CLI smoke
        run: |
          node bin/mcpreflight.mjs --version
          node bin/mcpreflight.mjs --help > /dev/null
      - name: Version drift check
        run: node scripts/version-check.mjs
      - name: notify failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
