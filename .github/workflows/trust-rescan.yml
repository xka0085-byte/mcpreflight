name: Weekly Trust Directory rescan
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan registry
        run: |
          rm -f trust-data/scan-full.jsonl
          node scripts/trust-scan-all.mjs
      - name: Generate directory
        run: |
          node scripts/trust-convert.mjs
          node scripts/history-snapshot.mjs
          node scripts/x402-cohort.mjs
          node scripts/x402-drift.mjs || echo "::warning::x402 drift step failed, weekly data kept"
          node scripts/trust-gen.mjs
          node scripts/gen-sitemap.mjs
          node scripts/scan-stats.mjs
          node scripts/registry-changes.mjs
          node scripts/erc8004-snapshot.mjs
      - name: Context cost ranking
        continue-on-error: true
        run: node scripts/context-cost.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs trust-data
          git diff --cached --quiet || git commit -m "trust: weekly rescan $(date -u +%F) [skip ci]"
          git pull --rebase origin main || git pull --rebase --autostash origin main
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
            echo "push attempt $i failed, retrying in 5s"; sleep 5
          done

      - name: notify failure
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/notify-failure.mjs "${{ github.workflow }}"
