name: MCP Trust Preflight
description: 'Preflight an MCP server in CI: check the initialize handshake, tools/list schemas and x402 drift. Read-only, no keys.'
author: Eidonze
branding:
  icon: shield
  color: blue
inputs:
  endpoint:
    description: Public MCP or x402 endpoint URL to inspect
    required: true
  mode:
    description: >-
      Inspection mode. schema for the MCP handshake and tool schemas, x402 for the
      payment layer alone (one request, the 402 challenge and its accepts[]), inspect
      for the full report, baseline to write the x402 challenge shape to the baseline
      file, drift to re-check it and fail when the shape changed
    required: false
    default: schema
  format:
    description: Report format, markdown or json
    required: false
    default: markdown
  method:
    description: HTTP method used for inspect, baseline and drift modes
    required: false
    default: POST
  baseline:
    description: Path to the committed x402 challenge baseline used by drift mode
    required: false
    default: mcpreflight-baseline.json
  fail_on:
    description: Fail the job when the report status is FAIL, UNKNOWN or DRIFTED
    required: false
    default: 'true'
outputs:
  status:
    description: Preflight exit status, 0 PASS, 1 FAIL, 2 UNKNOWN or network, 3 usage
    value: ${{ steps.preflight.outputs.status }}
runs:
  using: composite
  steps:
    - name: Run MCP Trust Preflight
      id: preflight
      shell: bash
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        MODE: ${{ inputs.mode }}
        FORMAT: ${{ inputs.format }}
        METHOD: ${{ inputs.method }}
        BASELINE: ${{ inputs.baseline }}
        FAIL_ON: ${{ inputs.fail_on }}
      run: |
        set -o pipefail
        if ! command -v node >/dev/null 2>&1; then
          echo "Node.js >= 18 is required, node was not found on PATH" >&2
          exit 3
        fi
        if ! node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 18 ? 0 : 1)'; then
          echo "Node.js >= 18 is required, found $(node -v)" >&2
          exit 3
        fi
        case "$MODE" in
          schema)
            args=(schema "$ENDPOINT" "--format=$FORMAT")
            ;;
          inspect)
            args=(inspect "$ENDPOINT" "--format=$FORMAT" "--method=$METHOD")
            ;;
          x402)
            args=(inspect "$ENDPOINT" "--x402" "--format=$FORMAT" "--method=$METHOD")
            ;;
          baseline)
            args=(baseline "$ENDPOINT" "--format=$FORMAT" "--method=$METHOD" "--baseline=$BASELINE")
            ;;
          drift)
            args=(drift "$ENDPOINT" "--format=$FORMAT" "--method=$METHOD" "--baseline=$BASELINE")
            ;;
          *)
            echo "Unsupported mode: $MODE. Use schema, inspect, x402, baseline or drift." >&2
            exit 3
            ;;
        esac
        report="$(mktemp)"
        set +e
        node "$GITHUB_ACTION_PATH/bin/mcpreflight.mjs" "${args[@]}" 2>&1 | tee "$report"
        status="${PIPESTATUS[0]}"
        set -e
        echo "status=$status" >> "$GITHUB_OUTPUT"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### MCP Trust Preflight, mode \`$MODE\`"
            echo
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$FAIL_ON" = "true" ] && [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        exit 0
